name: Run Tests

on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: "3.10"

    - name: Install Poetry
      run: |
        pip install poetry

    - name: Install dependencies
      run: |
        poetry install --with dev

    - name: Run tests
      run: |
        poetry run pytest tests -vv

  test-latest-dependencies:
    # Installs the newest releases allowed by pyproject.toml (ignoring poetry.lock), so that
    # breaking changes in numpy / scipy / scikit-learn show up before users hit them.
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install package with latest dependencies
      run: |
        pip install --upgrade pip
        pip install --upgrade . pytest

    - name: Run tests
      run: |
        pytest tests -vv
